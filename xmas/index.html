<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Gift · 圣诞礼物</title>
<meta name="description" content="Tap your ornament, open today's Christmas wish 碰一碰挂饰，打开今天的圣诞祝福">
<style>
  :root{--red:#C8102E;--deep:#0E2A1C;--green:#1E8A3A;--gold:#F5C400;--snow:#F7F7F2}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 50% 0%,#1F5A3A 0,#123A26 45%,var(--deep) 100%) fixed;background-color:var(--deep);color:var(--snow);display:flex;flex-direction:column;align-items:center;padding:28px 16px 32px;overflow-x:hidden;text-align:center}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  main{position:relative;z-index:1;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
  .for{font-size:15px;color:var(--gold);letter-spacing:2px;min-height:20px}
  h1{font-size:30px;margin-top:6px;letter-spacing:1px}
  h1 small{display:block;font-size:17px;font-weight:500;opacity:.85;margin-top:2px}
  .count{display:flex;gap:10px;margin-top:18px}
  .count div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;min-width:64px}
  .count b{display:block;font-size:26px;color:var(--gold)}
  .count span{font-size:11px;opacity:.8}
  .countlabel{font-size:13px;opacity:.8;margin-top:8px}
  .gift{position:relative;width:150px;height:150px;margin:34px auto 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .gift .box{position:absolute;left:15px;right:15px;bottom:0;height:95px;background:var(--red);border-radius:8px;box-shadow:0 12px 26px rgba(0,0,0,.4)}
  .gift .lid{position:absolute;left:5px;right:5px;top:35px;height:32px;background:#E0233F;border-radius:8px;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .7s;z-index:2}
  .gift .rib-v{position:absolute;left:50%;width:18px;margin-left:-9px;top:35px;bottom:0;background:var(--gold);z-index:3;transition:opacity .4s}
  .gift .bow{position:absolute;left:50%;top:8px;width:60px;height:34px;margin-left:-30px;z-index:4;transition:transform .7s cubic-bezier(.3,1.5,.5,1),opacity .7s}
  .gift .bow:before,.gift .bow:after{content:"";position:absolute;top:4px;width:28px;height:26px;border:7px solid var(--gold);border-radius:50% 50% 50% 0}
  .gift .bow:before{left:0;transform:rotate(-20deg)}
  .gift .bow:after{right:0;transform:scaleX(-1) rotate(-20deg)}
  .gift.wobble{animation:wob 1.6s ease-in-out infinite}
  @keyframes wob{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}82%{transform:rotate(6deg)}88%{transform:rotate(-4deg)}94%{transform:rotate(3deg)}}
  .gift.open .lid{transform:translateY(-70px) rotate(-18deg);opacity:0}
  .gift.open .bow{transform:translateY(-90px) rotate(25deg);opacity:0}
  .hint{font-size:14px;opacity:.85;margin-top:8px}
  .card{display:none;margin-top:18px;width:100%;background:var(--snow);color:#1C2A22;border-radius:16px;padding:22px 18px;box-shadow:0 14px 30px rgba(0,0,0,.35);border-top:8px solid var(--red);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
  .card .no{font-size:12px;color:var(--green);letter-spacing:2px;font-weight:700}
  .card .zh{font-size:21px;font-weight:700;margin-top:8px;line-height:1.45}
  .card .en{font-size:15px;margin-top:8px;line-height:1.5;color:#3C4A42}
  .card .come{font-size:12px;margin-top:14px;color:#6B776F}
  .btns{display:flex;gap:10px;margin-top:16px;width:100%}
  .btns a,.btns button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:13px 10px;border-radius:12px;border:0;cursor:pointer;text-decoration:none;display:block}
  .share{background:var(--gold);color:#2A2000}
  .shop{background:rgba(255,255,255,.12);color:var(--snow);border:1px solid rgba(255,255,255,.3)!important}
  footer{margin-top:26px;font-size:12px;opacity:.6}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <div class="for" id="for"></div>
  <h1 id="title">Merry Christmas<small>圣诞快乐</small></h1>
  <div class="count" id="count"></div>
  <div class="countlabel" id="countlabel"></div>
  <div class="gift wobble" id="gift" role="button" aria-label="Open gift 打开礼物">
    <div class="box"></div><div class="lid"></div><div class="rib-v"></div><div class="bow"></div>
  </div>
  <div class="hint" id="hint">点礼物，打开今天的祝福<br>Tap the gift to open today's wish</div>
  <div class="card" id="card">
    <div class="no" id="no"></div>
    <div class="zh" id="zh"></div>
    <div class="en" id="en"></div>
    <div class="come">每天碰一次挂饰，都有新的祝福 · Tap your ornament every day for a new wish</div>
  </div>
  <div class="btns" id="btns" style="display:none">
    <button class="share" id="share">分享 Share</button>
    <button class="shop" id="more">再来一个 One more</button>
  </div>
  <footer>© 2026 PrintNest · 3D printed in Malaysia</footer>
</main>
<script>
const WISHES = [
 ['愿你今年收到的礼物，都刚好是你想要的。','May every gift this year be exactly what you hoped for.'],
 ['今天适合吃多一块蛋糕，不用内疚。','Today is a good day for one more slice of cake. No guilt.'],
 ['你身边的人，比你想的更感谢你。','The people around you are more thankful for you than you know.'],
 ['愿你的圣诞充满笑声和热可可。','Wishing you a Christmas full of laughter and hot chocolate.'],
 ['明年会有一件好事，悄悄来敲门。','Something good is quietly on its way to your door next year.'],
 ['今天给一个好久没联系的人发个信息吧。','Send a message to someone you have not talked to in a while.'],
 ['你今年已经很努力了，好好休息。','You worked hard this year. Rest well.'],
 ['愿你的愿望清单，一个一个打勾。','May your wish list get ticked off, one by one.'],
 ['圣诞老人说：你今年是乖孩子名单的。','Santa says: you made the nice list this year.'],
 ['今天的幸运色是红色，穿一点红吧。','Your lucky colour today is red. Wear a little.'],
 ['愿你身体健康，吃什么都香。','Good health to you, and may everything you eat taste great.'],
 ['一个拥抱，可以让今天变得更暖。','One hug can make today a little warmer.'],
 ['愿新的一年，钱包和心都满满的。','May your wallet and your heart both be full next year.'],
 ['今天适合听一首旧歌，想起好时光。','A good day to play an old song and remember good times.'],
 ['你是别人生命里的一份礼物。','You are a gift in someone else\'s life.'],
 ['愿你遇到的每个红灯，都刚好变绿。','May every red light you meet turn green just in time.'],
 ['今年最好的回忆，还没结束。','The best memory of this year is not over yet.'],
 ['愿你在 2027 年，做到一件一直想做的事。','In 2027, may you finally do the thing you always wanted to.'],
 ['把烦恼包起来，送给圣诞老人吧。','Wrap up your worries and hand them to Santa.'],
 ['今天适合对自己说：辛苦了。','Today, tell yourself: well done.'],
 ['愿你被温柔的人包围。','May you be surrounded by kind people.'],
 ['小小的好运，正在你身边转圈。','A little bit of luck is spinning around you right now.'],
 ['愿你笑的次数，比叹气多很多。','May you laugh far more often than you sigh.'],
 ['今晚的星星，有一颗是为你亮的。','One of tonight\'s stars is shining just for you.'],
 ['愿你的家，永远有灯为你留着。','May there always be a light left on for you at home.'],
 ['今天适合吃一顿好的，和喜欢的人。','A good day for a good meal with people you love.'],
 ['新的一年，从一个好觉开始。','Start the new year with a really good sleep.'],
 ['愿你平安、快乐、不加班。','Peace, joy, and no overtime.'],
 ['你值得所有美好的事。','You deserve every good thing.'],
 ['愿这个挂饰，每年都提醒你被爱着。','May this ornament remind you every year that you are loved.'],
 ['愿你的每个早晨，都有一杯刚好的咖啡。','May every morning start with a perfect cup of coffee.'],
 ['今年没说出口的谢谢，今天说吧。','Say the thank-you you did not get to say this year.'],
 ['愿你的烦恼像雪花，落地就融化。','May your worries be like snowflakes, melting the moment they land.'],
 ['你的笑容，是别人今天最好的礼物。','Your smile is the best gift someone gets today.'],
 ['愿你明年的运气，比今年更好一点。','May next year be a little luckier than this one.'],
 ['今天适合和家人拍一张合照。','A good day to take a photo with your family.'],
 ['愿你想见的人，都在身边。','May everyone you want to see be right beside you.'],
 ['慢慢来，你已经走得很好了。','Take it slow. You are doing better than you think.'],
 ['愿你的冰箱永远满满，心情永远饱饱。','May your fridge stay full and your heart stay happy.'],
 ['今天适合原谅一个人，包括你自己。','Today is a good day to forgive someone, including yourself.'],
 ['愿你收到一个意想不到的好消息。','May an unexpected piece of good news find you.'],
 ['圣诞的魔法，就是有人记得你。','The magic of Christmas is someone remembering you.'],
 ['愿你的努力，明年都开花结果。','May all your hard work bloom next year.'],
 ['今天适合早点睡，做个好梦。','Go to bed early tonight and have a sweet dream.'],
 ['愿你和朋友的笑声，比烟花还响。','May you and your friends laugh louder than the fireworks.'],
 ['你给出去的温暖，都会绕一圈回到你身边。','The warmth you give away always finds its way back to you.'],
 ['愿你的新年愿望，第一个就实现。','May the first wish on your New Year list come true.'],
 ['今天适合吃一颗糖，让日子甜一点。','Have a sweet today, and let life be a little sweeter.'],
 ['愿你一直保有好奇心和孩子般的快乐。','May you always keep your curiosity and childlike joy.'],
 ['谢谢你，让这个世界多了一点温柔。','Thank you for making the world a little kinder.']
];
const q = new URLSearchParams(location.search);
const name = (q.get('n') || q.get('to') || '').slice(0, 20);
if (name) document.getElementById('for').textContent = 'For ' + name + ' 🎄 送给 ' + name;

// ---- countdown: Christmas, then New Year 2027, then CNY 2027
const now = new Date();
const y = now.getFullYear();
const targets = [
  [new Date(y, 11, 25), 'Merry Christmas', '圣诞快乐', '距离圣诞节 · until Christmas'],
  [new Date(y + 1, 0, 1), 'Happy New Year', '新年快乐', '距离 ' + (y + 1) + ' 新年 · until New Year'],
];
let t = targets.find(x => x[0] > now);
const title = document.getElementById('title'), cnt = document.getElementById('count'), lab = document.getElementById('countlabel');
const sameDay = (a, b) => a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
if (sameDay(now, new Date(y, 11, 25)) || sameDay(now, new Date(y, 11, 24))) { title.innerHTML = 'Merry Christmas<small>圣诞快乐！</small>'; t = targets[1]; }
else if (now.getMonth() === 0 && now.getDate() <= 7) { title.innerHTML = 'Happy ' + y + '<small>新年快乐！</small>'; t = null; }
else if (t) title.innerHTML = t[1] + '<small>' + t[2] + '</small>';
function tick() {
  if (!t) { cnt.style.display = 'none'; lab.textContent = ''; return; }
  let s = Math.max(0, Math.floor((t[0] - new Date()) / 1000));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  cnt.innerHTML = [[d, '天 days'], [h, '时 hrs'], [m, '分 min'], [ss, '秒 sec']].map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join('');
  lab.textContent = t[3];
}
tick(); setInterval(tick, 1000);

// ---- today's wish: same wish all day for this name, new one tomorrow
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const dayKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate();
let idx = hash(dayKey + '|' + name) % WISHES.length;
const seen = new Set([idx]);
function showWish() {
  document.getElementById('no').textContent = 'WISH No.' + String(idx + 1).padStart(2, '0');
  document.getElementById('zh').textContent = WISHES[idx][0];
  document.getElementById('en').textContent = WISHES[idx][1];
}
document.getElementById('more').addEventListener('click', () => {
  if (seen.size >= WISHES.length) seen.clear();
  do { idx = Math.floor(Math.random() * WISHES.length); } while (seen.has(idx));
  seen.add(idx); showWish();
  const c = document.getElementById('card'); c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
});
const gift = document.getElementById('gift');
gift.addEventListener('click', () => {
  if (gift.classList.contains('open')) return;
  gift.classList.remove('wobble'); gift.classList.add('open');
  setTimeout(() => {
    showWish();
    document.getElementById('card').style.display = 'block';
    document.getElementById('btns').style.display = 'flex';
    document.getElementById('hint').style.display = 'none';
    gift.style.display = 'none';
  }, 550);
});
document.getElementById('share').addEventListener('click', async () => {
  const text = '我今天的圣诞祝福 My Christmas wish: ' + WISHES[idx][0] + ' ' + WISHES[idx][1];
  try { if (navigator.share) await navigator.share({ title: 'Christmas wish', text, url: location.href }); else { await navigator.clipboard.writeText(text + ' ' + location.href); document.getElementById('share').textContent = '已复制 Copied'; } } catch (e) {}
});

// ---- snow
const cv = document.getElementById('snow'), cx = cv.getContext('2d'); let W, H, flakes = [];
function rs() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }
rs(); addEventListener('resize', rs);
for (let i = 0; i < 70; i++) flakes.push({ x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.5, s: .3 + Math.random() * .7, w: Math.random() * 6 });
(function draw() {
  cx.clearRect(0, 0, W, H); cx.fillStyle = 'rgba(255,255,255,.8)';
  for (const f of flakes) { f.y += f.s * .0015; f.w += .01; if (f.y > 1.02) { f.y = -.02; f.x = Math.random(); }
    cx.beginPath(); cx.arc((f.x + Math.sin(f.w) * .01) * W, f.y * H, f.r * devicePixelRatio, 0, 7); cx.fill(); }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
